# Keep the pinned actions in the workflows current, and the NuGet packages (including
# OverShell.Terminal.Wpf, the fork's build of the terminal control) - weekly, grouped: one pull
# request per ecosystem per week rather than one per package, since every pull request is a CI
# run and every merge another; six separate bumps one Monday cost twelve runs for two groups' worth
# of change. A major-version bump still comes on its own, where it deserves a look of its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The test runner's 4.0.1 is on nuget.org but not on the proxy feeds the reference machine
    # restores through (NU1102 locally; CI restores it fine), so the pin stays at 4.0.0 and a weekly
    # re-proposal of the one version that cannot restore here is not wanted. Lift when the feed has it.
    ignore:
      - dependency-name: xunit.runner.visualstudio
        versions: ["4.0.1"]

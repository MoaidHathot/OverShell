ShortDescription: A Windows terminal for running AI coding agents, built on the Windows Terminal engine
Description: |-
  OverShell (Overseer Shell) wraps the real Windows Terminal rendering engine in its own tabs, views and layouts,
  and watches the AI coding agents running in them - OpenCode, GitHub Copilot CLI, Claude Code, Codex - so you know
  which tab is working, which one is waiting for you, and which one finished while you were looking elsewhere.
  Herd sidebar and dashboard views, a prompt bar that broadcasts to agents, notifications (in-window, taskbar,
  Windows toasts, or any command), session restore with agent resume, tear-off windows, and live-reloading JSONC
  configuration. Reads your existing Windows Terminal settings.json for profiles and colour schemes.
